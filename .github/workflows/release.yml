name: Prepare release
on:
  push:
    tags: ['framework-v[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify and assemble
        run: |
          sh ./mvnw --batch-mode --no-transfer-progress verify -Papi-artifacts
          sh scripts/package-release.sh
      - name: Save release files
        uses: actions/upload-artifact@v4
        with:
          name: astra-release
          path: release/
      - name: Create draft testing release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^framework.version=//p' release/astra-release.properties)
          test "$GITHUB_REF_NAME" = "framework-v$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
            --title "Astra $version (testing)" \
            --notes 'Testing release. Publish the matching Maven API before making this release public. See docs/development.md.' \
            release/*.zip release/*.jar release/*.pom release/astra-release.properties \
            release/init.ps1 release/init.sh release/SHA256SUMS
